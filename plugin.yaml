name: api_rotation_by_kame
title: Key-Aware Management Engine (API Rotation)
description: KAME rotates API keys to avoid 429 errors, cooldown exhausted keys, respect retry delays, and route around provider outages during long agent runs. v1.0.5 fixes daily-quota logic (always probe at the configured interval, never shorten existing cooldowns), honors chat pause, and adds a key-status panel with reset button.
