name: api_rotation_by_kame
title: Key-Aware Management Engine (API Rotation)
description: KAME rotates API keys to avoid 429 errors, cooldown exhausted keys, respect retry delays, and route around provider outages during long agent runs. v1.0.4 adds Agent Zero V2 compatibility (auto-detects the v1.x vs V2 model-streaming layer) while keeping the rotation engine identical.
version: 1.0.4
settings_sections:
  - agent
per_project_config: false
per_agent_config: false
always_enabled: false
