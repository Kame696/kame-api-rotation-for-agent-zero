name: api_rotation_by_kame
title: KAME API Rotation
description: "[FUTURE-PROOF — VERIFIED ON A0 v1.14 → v2.10] KAME is a learning key-rotation engine for Agent Zero. Instead of blindly cycling API keys like round-robin, it tracks each key's health per provider:model, respects the provider's own retry-delay to the second, tells daily quotas apart from per-minute limits, and never re-probes a key before it's actually ready. When every key is temporarily down, KAME sleeps until the exact moment one recovers instead of burning wasted requests — and the agent never sees an error; since v1.2.0 it also says so in the chat, so a long wait cannot be mistaken for a hung agent. Since v1.0.9 KAME only CHOOSES the key and lets Agent Zero make the call itself, so new Agent Zero releases no longer break it. Verified end-to-end on Agent Zero v1.14, v1.20, v2.1, v2.4, v2.7, v2.8 and v2.10; zero configuration required (only set APIs on provider as api1,api2,api3,etc)."
version: 1.2.0
settings_sections:
  - agent
per_project_config: false
per_agent_config: false
always_enabled: false
