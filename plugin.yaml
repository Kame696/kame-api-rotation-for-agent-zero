name: api_rotation_by_kame
title: Key-Aware Management Engine (API Rotation)
description: The learning carousel for Agent Zero. Round-robin is dumb; KAME learns. Identity-aware health tracking per provider:model pair, RPM-aware predictive key selection, anti-dogpile + anti-thundering-herd guards for concurrency, Trust-the-Connection (zero artificial timeouts), smart quarantine that parses the provider's own retry-delay, and ETA-driven sleep that respects the cooldown EXACTLY instead of burning wasted 429 requests. v1.0.1 adds multi-provider daily-quota & account-limit awareness (it no longer trusts a misleading short retryDelay on an exhausted key), a provider-agnostic adaptive backoff safety net, honest per-call error reporting (real status + kind), and a reworked, self-explanatory log with a configurable level (silent / normal / verbose) — success is never silent, yet the plugin can stay fully out of the Docker log when you need it. v1.0.1 also lands three reliability fixes — a chat message sent mid-run is received without the nudge button, a stream that fails mid-output no longer re-generates from scratch, and sustained 503 server outages escalate gently instead of spinning forever. Production-validated across thousands of operations. Clean monkey-patch + clean uninstall. Anti-bot jitter preserved on every wait.
version: 1.0.1
