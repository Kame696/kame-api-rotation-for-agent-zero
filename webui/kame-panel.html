<html>
<head>
  <title>API Rotation</title>
  <script type="module">
    import { store } from "/plugins/api_rotation_by_kame/webui/kame-panel-store.js";
  </script>
</head>
<body>
<div x-data>
  <template x-if="$store.kamePanel">
    <div class="kame-panel" x-create="$store.kamePanel.onOpen()" x-destroy="$store.kamePanel.cleanup()">

      <div class="kame-head">
        <div>
          <div class="kame-title">API Rotation</div>
          <div class="kame-sub">KAME <span x-text="$store.kamePanel.version"></span></div>
        </div>
        <div class="kame-status" x-show="$store.kamePanel.headerStatus.text">
          <span class="kame-dot" :class="'kame-dot-' + $store.kamePanel.headerStatus.tone"></span>
          <span x-text="$store.kamePanel.headerStatus.text"></span>
          <span class="kame-bad" x-show="$store.kamePanel.headerStatus.replace"
                x-text="$store.kamePanel.headerStatus.replace + ' to replace'"></span>
        </div>
      </div>

      <div class="kame-tabs">
        <template x-for="t in [['overview','Overview'],['settings','Settings'],['fallback','Fallback models'],['events','Events'],['background','Background jobs']]" :key="t[0]">
          <button class="btn" :class="$store.kamePanel.tab === t[0] ? 'btn-ok' : ''"
                  @click="$store.kamePanel.tab = t[0]" x-text="t[1]"></button>
        </template>
      </div>

      <div class="kame-error" x-show="$store.kamePanel.error" x-text="$store.kamePanel.error"></div>
      <div class="kame-note" x-show="$store.kamePanel.message" x-text="$store.kamePanel.message"></div>

      <!-- ===== Overview ===== -->
      <div class="kame-stack" x-show="$store.kamePanel.tab === 'overview'">

        <div class="kame-card" x-show="$store.kamePanel.first">
          <div class="kame-card-title">Getting started</div>
          <p>KAME is running, and no pooled key has been used yet. Nothing is wrong &mdash; this page fills in the first time a call goes out.</p>
          <ol class="kame-small">
            <li>Open Settings &gt; API keys in Agent Zero and paste several keys into one provider key field, separated by commas. KAME reads them as the several keys they are.</li>
            <li><code>/kame-keys</code> does the same thing in bulk, from the chat.</li>
            <li>Send a message. The chip above the message box starts showing your keys from the first call.</li>
          </ol>
          <p class="kame-dim kame-small">With one key there is nothing to rotate to, and what remains &mdash; backoff sized from what the provider actually said, and a failure that waits instead of ending the turn &mdash; still works.</p>
        </div>

        <!-- three sentences -->
        <section class="kame-now" :class="'kame-now-' + $store.kamePanel.said.tone">
          <p class="kame-now-1"><span class="kame-dim" aria-hidden="true" x-text="$store.kamePanel.said.icon"></span> <span x-text="$store.kamePanel.said.line1"></span></p>
          <p class="kame-now-2" :class="'kame-tone-' + $store.kamePanel.said.tone" x-text="$store.kamePanel.said.line2"></p>
          <p class="kame-now-3 kame-dim" x-show="$store.kamePanel.said.line3" x-text="$store.kamePanel.said.line3"></p>
          <p class="kame-now-note kame-dim kame-small" x-show="$store.kamePanel.said.note" x-text="$store.kamePanel.said.note"></p>
        </section>

        <!-- Your models -->
        <div class="kame-card">
          <div class="kame-card-title">Your models</div>
          <div class="kame-dim kame-small" x-text="$store.kamePanel.ringsNote"></div>
          <p class="kame-dim" x-show="!$store.kamePanel.ringGroups.main.length &amp;&amp; !$store.kamePanel.ringGroups.also.length">Nothing recorded yet &mdash; no call has been made through a pooled key this session.</p>

          <div class="kame-rings">
            <template x-for="(c, i) in $store.kamePanel.ringGroups.main" :key="c.identity">
              <div class="kame-ring-slot">
                <span class="kame-arrow kame-dim" aria-hidden="true" x-show="i > 0 &amp;&amp; $store.kamePanel.ringGroups.chain">&rsaquo;</span>
                <button type="button" class="kame-ring" :class="c.open ? 'kame-ring-open' : ''" :aria-expanded="c.open" :aria-label="c.aria"
                        @click="$store.kamePanel.toggleRing(c.identity)">
                  <span class="kame-ring-art" x-html="c.svg"></span>
                  <span class="kame-ring-name" :title="c.identity" x-text="c.title"></span>
                  <span class="kame-ring-word" :class="'kame-tone-' + c.tone" x-text="c.word"></span>
                  <span class="kame-ring-side kame-dim" x-show="c.side" x-text="c.side"></span>
                </button>
              </div>
            </template>
          </div>
          <div x-show="$store.kamePanel.ringGroups.also.length">
            <div class="kame-dim kame-small">Also used by background jobs</div>
            <div class="kame-rings">
              <template x-for="c in $store.kamePanel.ringGroups.also" :key="c.identity">
                <button type="button" class="kame-ring kame-ring-small" :class="c.open ? 'kame-ring-open' : ''" :aria-expanded="c.open" :aria-label="c.aria"
                        @click="$store.kamePanel.toggleRing(c.identity)">
                  <span class="kame-ring-art" x-html="c.svg"></span>
                  <span class="kame-ring-name" :title="c.identity" x-text="c.title"></span>
                  <span class="kame-ring-word" :class="'kame-tone-' + c.tone" x-text="c.word"></span>
                  <span class="kame-ring-side kame-dim" x-show="c.side" x-text="c.side"></span>
                </button>
              </template>
            </div>
          </div>
          <div class="kame-legend kame-dim kame-small" x-show="$store.kamePanel.ringGroups.main.length || $store.kamePanel.ringGroups.also.length">
            <template x-for="item in $store.kamePanel.legend" :key="item.code">
              <span class="kame-legend-item"><span x-html="item.svg"></span> <span x-text="item.text"></span></span>
            </template>
          </div>

          <!-- the open model's keys -->
          <template x-if="$store.kamePanel.keyTable">
            <div class="kame-keytable">
              <p x-show="$store.kamePanel.keyTable.empty" class="kame-dim" x-text="$store.kamePanel.keyTable.empty"></p>
              <div x-show="!$store.kamePanel.keyTable.empty">
                <div class="kame-card-title" x-text="$store.kamePanel.keyTable.label"></div>
                <div class="kame-dim" x-text="$store.kamePanel.keyTable.summary"></div>
                <ul class="kame-keylist">
                  <template x-for="k in $store.kamePanel.keyTable.keys" :key="k.fingerprint">
                    <li><span class="kame-mono"><span class="kame-glyph" :style="'color:' + k.colour" x-text="k.glyph"></span><span x-text="k.fingerprint"></span></span>
                      <span class="kame-dim" x-text="k.words"></span></li>
                  </template>
                </ul>
                <div class="kame-actions">
                  <template x-if="$store.kamePanel.confirming === 'wake'">
                    <span>
                      <span class="kame-small">Its keys start again as if never tried; a key that is really spent is refused again. No key is deleted.</span>
                      <button class="btn btn-ok" :disabled="$store.kamePanel.busy" @click="$store.kamePanel.act('clear_pool', $store.kamePanel.keyTable.identity)">Wake it</button>
                      <button class="btn" @click="$store.kamePanel.confirming = ''">Cancel</button>
                    </span>
                  </template>
                  <template x-if="$store.kamePanel.confirming === 'try'">
                    <span>
                      <span class="kame-small">The next reply asks this model first again, even if it was busy a moment ago.</span>
                      <button class="btn btn-ok" :disabled="$store.kamePanel.busy" @click="$store.kamePanel.act('forget_busy', $store.kamePanel.keyTable.identity)">Try it</button>
                      <button class="btn" @click="$store.kamePanel.confirming = ''">Cancel</button>
                    </span>
                  </template>
                  <template x-if="!$store.kamePanel.confirming">
                    <span>
                      <button class="btn" :disabled="$store.kamePanel.busy" @click="$store.kamePanel.confirming = 'wake'">Wake this model</button>
                      <button class="btn" x-show="$store.kamePanel.keyTable.busy" :disabled="$store.kamePanel.busy" @click="$store.kamePanel.confirming = 'try'">Try this model now</button>
                    </span>
                  </template>
                </div>
                <p class="kame-dim kame-small">Keys are added or removed with <code>/kame-keys</code> (or in Agent Zero's own key settings); this page never touches one.</p>
              </div>
            </div>
          </template>
        </div>

        <!-- What KAME did -->
        <div class="kame-card">
          <div class="kame-card-title">What KAME did</div>
          <p class="kame-dim" x-show="!$store.kamePanel.moves.length">Nothing to report &mdash; every reply went straight out.</p>
          <ul class="kame-moves" x-show="$store.kamePanel.moves.length">
            <template x-for="(mv, i) in $store.kamePanel.moves" :key="i">
              <li><span><span class="kame-dim" aria-hidden="true" x-text="mv.icon"></span> <span x-text="mv.text"></span></span>
                <span class="kame-dim kame-small" x-text="mv.ago"></span></li>
            </template>
          </ul>
          <button class="btn" @click="$store.kamePanel.tab = 'events'">All events &rarr;</button>
        </div>

        <!-- Quick controls -->
        <div class="kame-card">
          <div class="kame-card-title">Quick controls</div>
          <div class="kame-dim kame-small">The three you may want to change often. Everything else is in Settings.</div>
          <template x-for="m in $store.kamePanel.quickChoices" :key="m.name">
            <div>
              <div class="kame-setting">
                <div class="kame-setting-label"><span class="kame-setting-title" x-text="m.title"></span></div>
                <div class="kame-setting-control">
                  <div class="kame-choices">
                    <template x-for="c in $store.kamePanel.choicesOf(m)" :key="c">
                      <button type="button" class="kame-choice" :class="String($store.kamePanel.value(m.name)) === c ? 'kame-choice-on' : ''"
                              @click="$store.kamePanel.save(m.name, c)" x-text="$store.kamePanel.choiceLabel(m, c)"></button>
                    </template>
                  </div>
                </div>
                <div class="kame-dim kame-small kame-setting-help" x-text="$store.kamePanel.choiceSentence(m)"></div>
              </div>
              <p class="kame-small" :class="$store.kamePanel.speedCost &amp;&amp; $store.kamePanel.speedCost.over ? 'kame-tone-warn' : 'kame-dim'"
                 x-show="m.name === 'hedge_mode' &amp;&amp; $store.kamePanel.speedCost"
                 x-text="$store.kamePanel.speedCost ? $store.kamePanel.speedCost.text : ''"></p>
            </div>
          </template>
          <template x-if="$store.kamePanel.quickTimed">
            <div class="kame-setting">
              <div class="kame-setting-label"><span class="kame-setting-title" x-text="$store.kamePanel.quickTimed.title"></span></div>
              <div class="kame-setting-control">
                <input type="number" :min="$store.kamePanel.quickTimed.low" :max="$store.kamePanel.quickTimed.high"
                       :value="$store.kamePanel.value('failover_after_seconds')"
                       @input="$store.kamePanel.draft('failover_after_seconds', $event.target.value)"
                       @change="$store.kamePanel.save('failover_after_seconds', $event.target.value)" />
              </div>
            </div>
          </template>
          <template x-for="m in $store.kamePanel.quickNotice" :key="m.name">
            <div class="kame-setting">
              <div class="kame-setting-label"><span class="kame-setting-title" x-text="m.title"></span></div>
              <div class="kame-setting-control">
                <div class="kame-choices">
                  <template x-for="c in $store.kamePanel.choicesOf(m)" :key="c">
                    <button type="button" class="kame-choice" :class="String($store.kamePanel.value(m.name)) === c ? 'kame-choice-on' : ''"
                            @click="$store.kamePanel.save(m.name, c)" x-text="$store.kamePanel.choiceLabel(m, c)"></button>
                  </template>
                </div>
              </div>
            </div>
          </template>
          <button class="btn" @click="$store.kamePanel.tab = 'settings'">All settings &rarr;</button>
        </div>

        <!-- Details (folded) -->
        <section class="kame-details">
          <button type="button" class="kame-details-toggle" :aria-expanded="$store.kamePanel.detailsOpen"
                  @click="$store.kamePanel.detailsOpen = !$store.kamePanel.detailsOpen"
                  x-text="($store.kamePanel.detailsOpen ? '▾' : '▸') + ' Details'"></button>
          <div class="kame-stack" x-show="$store.kamePanel.detailsOpen">

            <div class="kame-card" x-show="$store.kamePanel.activity.kind !== 'idle'">
              <div class="kame-card-title">Right now</div>
              <div x-text="$store.kamePanel.said.line1"></div>
              <div class="kame-dim kame-small" x-show="$store.kamePanel.waitingSince" x-text="'waiting since ' + $store.kamePanel.waitingSince"></div>
            </div>

            <div class="kame-card" x-show="$store.kamePanel.backgroundLines.length">
              <div class="kame-card-title">Background jobs and your quota</div>
              <div class="kame-dim kame-small">Titles, summaries and other side jobs spend the same per-model quota as your chats.</div>
              <template x-for="(line, i) in $store.kamePanel.backgroundLines" :key="i">
                <p x-text="line"></p>
              </template>
            </div>

            <div class="kame-card">
              <div class="kame-card-title">Your API keys</div>
              <p class="kame-dim kame-small" x-show="!$store.kamePanel.keyGroups.length">No call has gone through KAME yet.</p>
              <template x-for="prov in $store.kamePanel.keyGroups" :key="prov.provider">
                <div class="kame-keygroup">
                  <div class="kame-mono" x-text="prov.provider"></div>
                  <template x-for="row in prov.rows" :key="row.fingerprint + row.code + row.words">
                    <div class="kame-keyrow">
                      <div><span class="kame-mono"><span class="kame-glyph" :style="'color:' + row.colour" x-text="row.glyph"></span><span x-text="row.fingerprint"></span></span>
                        <span class="kame-dim" x-text="row.words"></span></div>
                      <div class="kame-dim kame-small kame-models" x-text="row.modelsLine"></div>
                    </div>
                  </template>
                </div>
              </template>
              <p class="kame-dim kame-small">
                KAME rotates the keys Agent Zero already has. Put several keys of one provider in that provider's API key field,
                separated by commas (Settings &gt; API keys), or in <code>usr/.env</code> as <code>API_KEY_GOOGLE=key1,key2,key3</code>.
                From the chat: <code>/kame-keys add google key1,key2</code> or <code>/kame-keys import</code> with a pasted .env.
                Keys from different accounts each bring their own quota. KAME never shows a key: this page names each one by a short fingerprint.
              </p>
            </div>

            <div class="kame-card" x-show="$store.kamePanel.seams.rows.length">
              <div class="kame-card-title">Agent Zero, as KAME found it</div>
              <template x-for="r in $store.kamePanel.seams.rows" :key="r.name">
                <div><span x-text="r.ok ? '✓' : '⚠'"></span> <code x-text="r.name"></code>
                  <span class="kame-dim" x-show="!r.ok" x-text="'missing: ' + (r.missing || []).join(', ')"></span></div>
              </template>
              <div class="kame-dim" x-text="$store.kamePanel.seams.factory ? 'model factory found: the fallback list can build models' : 'model factory not found: the fallback list is skipped'"></div>
            </div>

            <div class="kame-card">
              <div class="kame-card-title">This Agent Zero process</div>
              <div x-text="$store.kamePanel.process"></div>
            </div>

            <div class="kame-card" x-show="$store.kamePanel.pools.length">
              <div class="kame-card-title">Each model's keys</div>
              <template x-for="pool in $store.kamePanel.pools" :key="pool.identity">
                <div class="kame-poolline"><b x-text="pool.identity"></b> <span class="kame-dim" x-text="$store.kamePanel.poolLine(pool)"></span></div>
              </template>
            </div>

            <div class="kame-counters">
              <div><b x-text="$store.kamePanel.speed.model_switches || 0"></b> Fallbacks</div>
              <div><b x-text="$store.kamePanel.speed.backups || 0"></b> Backup keys started
                (<span x-text="$store.kamePanel.speed.backup_wins || 0"></span> won)</div>
              <div><b x-text="$store.kamePanel.speed.probe_bursts || 0"></b> Keys asked together</div>
            </div>
            <div class="kame-card" x-show="$store.kamePanel.speed.last_model_switch?.to">
              Last fallback: <b x-text="$store.kamePanel.speed.last_model_switch?.to"></b>
              answered for <span x-text="$store.kamePanel.speed.last_model_switch?.from"></span>
              (<span x-text="$store.kamePanel.speed.last_model_switch?.reason"></span>,
              <span x-text="$store.kamePanel.clock($store.kamePanel.speed.last_model_switch?.at)"></span>).
            </div>

            <template x-for="f in $store.kamePanel.inFlight" :key="f.started + f.identity">
              <div class="kame-card kame-waiting">
                Still waiting: <b x-text="$store.kamePanel.jobWord(f.job)"></b> on
                <span x-text="f.identity"></span>, <span x-text="f.refusals"></span> refusal(s)<span x-show="f.last">, last: <span x-text="f.last"></span></span>.
              </div>
            </template>

            <div class="kame-card" x-show="$store.kamePanel.replies.length">
              <div class="kame-card-title">Last replies</div>
              <div class="kame-dim kame-small">The model that wrote each of the last replies (each step of a reply that uses
                tools counts), its first word and its whole time. A model from your fallback list says which model
                it answered for.</div>
              <template x-for="(r, i) in $store.kamePanel.replies" :key="i">
                <div>
                  <code x-text="r.model"></code>
                  <span class="kame-tone-warn" x-show="r.for" x-text="'for ' + r.for"></span>
                  <span x-text="'first word ' + (r.first_s == null ? '-' : r.first_s.toFixed(1) + ' s') + ' &middot; ' + r.total_s.toFixed(1) + ' s total'"></span>
                </div>
              </template>
            </div>
          </div>
        </section>
      </div>

      <!-- ===== Settings ===== -->
      <div class="kame-stack" x-show="$store.kamePanel.tab === 'settings'">
        <div class="kame-card">
          <div class="kame-card-title" x-text="$store.kamePanel.toolbarTitle"></div>
          <div class="kame-dim kame-small">Everything works without changing anything here. Changes apply on the next message and survive restarts.</div>
          <div class="kame-actions">
            <button class="btn" title="Reads the saved settings again and rebuilds this page on the spot." :disabled="$store.kamePanel.busy" @click="$store.kamePanel.refresh()">Refresh</button>
            <button class="btn" title="Every KAME setting goes back to its built-in default." :disabled="$store.kamePanel.busy" @click="$store.kamePanel.confirming = 'reset_all'">Reset to defaults</button>
            <button class="btn" title="Only clears rotation and quarantine; it does not delete any key." :disabled="$store.kamePanel.busy" @click="$store.kamePanel.confirming = 'clear_pool_all'">Clear pool</button>
            <button class="btn" title="Empties the event list on the Events page. Nothing else changes." :disabled="$store.kamePanel.busy" @click="$store.kamePanel.act('clear_events')">Clear events</button>
            <button class="btn" x-show="$store.kamePanel.advancedCount || $store.kamePanel.showAdvanced"
                    title="Settings that are already tuned or only one unusual setup needs. Hidden unless you changed them."
                    @click="$store.kamePanel.showAdvanced = !$store.kamePanel.showAdvanced"
                    x-text="$store.kamePanel.showAdvanced ? 'Hide advanced settings' : 'Show advanced settings (' + $store.kamePanel.advancedCount + ')'"></button>
          </div>
          <div class="kame-confirm" x-show="$store.kamePanel.confirming === 'reset_all'">
            <span class="kame-small">Every KAME setting goes back to its built-in default. Your fallback list and your keys are not touched.</span>
            <button class="btn btn-ok" @click="$store.kamePanel.act('reset_settings')">Reset everything</button>
            <button class="btn" @click="$store.kamePanel.confirming = ''">Cancel</button>
          </div>
          <div class="kame-confirm" x-show="$store.kamePanel.confirming === 'clear_pool_all'">
            <span class="kame-small">Every key starts again as if it had never been tried: cooldowns, quarantines and the request history are forgotten. This does not delete any key, and a key that is genuinely spent will simply be refused again.</span>
            <button class="btn btn-ok" @click="$store.kamePanel.act('clear_pool')">Clear the pool</button>
            <button class="btn" @click="$store.kamePanel.confirming = ''">Cancel</button>
          </div>
        </div>

        <template x-for="card in $store.kamePanel.settingCards" :key="card.id">
          <div class="kame-card">
            <div class="kame-card-title" x-text="card.title"></div>
            <div class="kame-dim kame-small" x-text="card.note"></div>

            <template x-if="card.id === 'off'">
              <button class="btn" @click="$store.kamePanel.showSwitches = !$store.kamePanel.showSwitches"
                      x-text="$store.kamePanel.showSwitches ? 'Hide these switches' : 'Show the ' + card.total + ' switches'"></button>
            </template>

            <template x-if="card.shows_fallback">
              <p><button class="btn" @click="$store.kamePanel.tab = 'fallback'">Edit your fallback models &rarr;</button></p>
            </template>

            <template x-if="card.shows_keys">
              <div class="kame-howto">
                <p>Add your keys in Agent Zero:</p>
                <ol class="kame-small">
                  <li>Put several keys of one provider in that provider's API key field (Settings &gt; API keys), separated by commas.</li>
                  <li>Or type <code>/kame-keys add google KEY1,KEY2,KEY3</code> in the chat (any provider name instead of google).</li>
                  <li>Type <code>/kame-keys</code> to see every key and how it is doing.</li>
                </ol>
                <p class="kame-dim kame-small">Agent Zero keeps the keys; KAME never shows one. The Overview tab shows how each one is doing.</p>
              </div>
            </template>

            <div x-show="card.id !== 'off' || $store.kamePanel.showSwitches">
              <template x-for="m in card.rows" :key="m.name">
                <div class="kame-setting">
                  <div class="kame-setting-label">
                    <span class="kame-setting-title" x-text="m.title"></span>
                    <code class="kame-dim kame-small" x-text="m.name"></code>
                    <div class="kame-dim kame-small">
                      <span x-text="m.sentence"></span>
                      <span x-show="m.env_override" x-text="'(set by ' + m.env_override + ' in the environment)'"></span>
                    </div>
                  </div>
                  <div class="kame-setting-control">
                    <template x-if="m.type === 'flag'">
                      <label class="toggle">
                        <input type="checkbox" :checked="!!$store.kamePanel.value(m.name)"
                               @change="$store.kamePanel.save(m.name, $event.target.checked)" />
                        <span class="toggler"></span>
                      </label>
                    </template>
                    <template x-if="m.type === 'choice'">
                      <div class="kame-choices">
                        <template x-for="c in $store.kamePanel.choicesOf(m)" :key="c">
                          <button type="button" class="kame-choice" :class="String($store.kamePanel.value(m.name)) === c ? 'kame-choice-on' : ''"
                                  @click="$store.kamePanel.save(m.name, c)" x-text="$store.kamePanel.choiceLabel(m, c)"></button>
                        </template>
                      </div>
                    </template>
                    <template x-if="m.type === 'number'">
                      <input type="number" :min="m.low" :max="m.high" :value="$store.kamePanel.value(m.name)"
                             @input="$store.kamePanel.draft(m.name, $event.target.value)"
                             @change="$store.kamePanel.save(m.name, $event.target.value)" />
                    </template>
                    <template x-if="m.type === 'text'">
                      <span>
                        <textarea rows="2" :value="$store.kamePanel.value(m.name)"
                                  @input="$store.kamePanel.draft(m.name, $event.target.value)"></textarea>
                        <button class="btn btn-ok" @click="$store.kamePanel.save(m.name, $store.kamePanel.value(m.name))">Save</button>
                      </span>
                    </template>
                    <button class="btn" x-show="$store.kamePanel.isChanged(m)" @click="$store.kamePanel.reset(m.name)">Reset</button>
                  </div>
                  <div class="kame-dim kame-small kame-setting-help" x-show="m.type === 'choice'" x-text="$store.kamePanel.choiceSentence(m)"></div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- ===== Fallback models ===== -->
      <div class="kame-stack" x-show="$store.kamePanel.tab === 'fallback'">
        <div class="kame-card">
          <div class="kame-card-title">Fallback models</div>
          <div class="kame-dim kame-small">
            Agent Zero has no fallback list of its own, so KAME keeps one. When your
            chat model cannot answer &mdash; every key resting longer than the time
            below, the provider has no server for it, two timeouts in a row, every
            key refused it &mdash; and nothing has been shown yet, KAME answers with the
            first model here that can. The next reply starts on your model again.
            Background jobs never switch model. Empty list: nothing ever switches.
          </div>

          <p class="kame-dim" x-show="!$store.kamePanel.rows.length">No fallback models yet. Click &ldquo;+ Add fallback model&rdquo; to choose the model KAME should try when yours cannot answer.</p>

          <ol class="kame-fb">
            <template x-for="(row, i) in $store.kamePanel.rows" :key="row.id">
              <li class="kame-fb-row" :class="$store.kamePanel.isDraft(row) ? 'kame-fb-draft' : ''">
                <span class="kame-fb-n" x-text="(i + 1) + '.'"></span>

                <template x-if="$store.kamePanel.hasSearch">
                  <select class="kame-fb-provider" :value="row.provider" aria-label="Provider"
                          @change="$store.kamePanel.setProvider(row, $event.target.value)">
                    <option value="">&mdash; provider &mdash;</option>
                    <template x-for="p in $store.kamePanel.providerOptions(row)" :key="p.value">
                      <option :value="p.value" :selected="p.value === row.provider" x-text="p.label"></option>
                    </template>
                  </select>
                </template>
                <template x-if="!$store.kamePanel.hasSearch">
                  <input type="text" class="kame-fb-provider" placeholder="provider" aria-label="Provider" :value="row.provider"
                         @input="row.provider = $event.target.value; $store.kamePanel.rowsDirty = true" />
                </template>

                <div class="kame-fb-model" @click.outside="row.open = false">
                  <input type="text" placeholder="model name" aria-label="Model name" :value="row.name"
                         @input="$store.kamePanel.typeModel(row, $event.target.value)"
                         @focus="$store.kamePanel.search(row, true)"
                         @keydown.escape="row.open = false" />
                  <div class="kame-fb-results" x-show="row.open &amp;&amp; row.results.length &gt; 0">
                    <div class="kame-fb-item kame-dim" x-show="row.source === 'litellm_registry'">Catalog suggestions &mdash; availability not verified</div>
                    <template x-for="m in $store.kamePanel.grouped(row).matched" :key="'m_' + m">
                      <div class="kame-fb-item kame-fb-matched" @click="$store.kamePanel.pick(row, m)" x-text="m"></div>
                    </template>
                    <template x-for="m in $store.kamePanel.grouped(row).rest" :key="'r_' + m">
                      <div class="kame-fb-item" @click="$store.kamePanel.pick(row, m)" x-text="m"></div>
                    </template>
                  </div>
                  <div class="kame-fb-results" x-show="row.open &amp;&amp; row.results.length === 0 &amp;&amp; !row.searching">
                    <div class="kame-fb-item kame-dim">No models found</div>
                  </div>
                </div>

                <span class="kame-fb-tools">
                  <button type="button" class="btn" title="Move up" aria-label="Move up" :disabled="i === 0" @click="$store.kamePanel.moveRow(i, -1)">&uarr;</button>
                  <button type="button" class="btn" title="Move down" aria-label="Move down" :disabled="i === $store.kamePanel.rows.length - 1" @click="$store.kamePanel.moveRow(i, 1)">&darr;</button>
                  <button type="button" class="btn" title="Remove" aria-label="Remove this model" @click="$store.kamePanel.removeRow(i)">&times;</button>
                </span>
                <span class="kame-fb-hint kame-tone-warn kame-small" x-show="$store.kamePanel.isDraft(row)">not saved &mdash; choose a model</span>
                <span class="kame-fb-hint kame-dim kame-small" x-show="row.api_base" x-text="'@ ' + row.api_base"></span>
              </li>
            </template>
          </ol>

          <div class="kame-actions">
            <button type="button" class="btn" @click="$store.kamePanel.addRow()">+ Add fallback model</button>
            <button type="button" class="btn btn-ok" @click="$store.kamePanel.saveRows()">Save list</button>
          </div>
          <p class="kame-dim kame-small" x-show="!$store.kamePanel.hasSearch">This Agent Zero has no model search, so the provider and the model are typed. Use Agent Zero's provider ids, as in the model settings.</p>
          <p class="kame-dim kame-small">Each model uses the keys Agent Zero has for its provider. Up to 12 models.</p>
        </div>

        <div class="kame-card">
          <div class="kame-setting">
            <div class="kame-setting-label">
              <span class="kame-setting-title">Switch to the next model after (seconds)</span>
              <div class="kame-dim kame-small">How long every key of your model may rest before the next model answers. 0 = never switch.</div>
            </div>
            <div class="kame-setting-control">
              <input type="number" min="0" max="3600" :value="$store.kamePanel.value('failover_after_seconds')"
                     @input="$store.kamePanel.draft('failover_after_seconds', $event.target.value)"
                     @change="$store.kamePanel.save('failover_after_seconds', $event.target.value)" />
            </div>
          </div>
        </div>
      </div>

      <!-- ===== Events / Background jobs ===== -->
      <template x-for="bg in [false, true]" :key="String(bg)">
        <div x-show="$store.kamePanel.tab === (bg ? 'background' : 'events')">
          <div class="section-description" x-text="bg
            ? 'Agent Zero\'s calls behind the scenes: memory, chat titles, summaries and compression. Kept apart so they never bury your conversation.'
            : 'What KAME decided for your conversation, newest first.'"></div>
          <div class="section-description" x-show="!$store.kamePanel.events(bg).length">Nothing yet.</div>
          <table class="kame-table" x-show="$store.kamePanel.events(bg).length">
            <thead><tr><th>When</th><th>What</th><th x-show="bg">Job</th><th>Model</th><th>Key</th><th>Why</th><th>Rest</th></tr></thead>
            <tbody>
              <template x-for="e in $store.kamePanel.events(bg)" :key="e.seq">
                <tr :class="$store.kamePanel.good(e.kind) ? 'kame-good' : ''">
                  <td x-text="$store.kamePanel.clock(e.at)"></td>
                  <td x-text="$store.kamePanel.kindWord(e.kind)"></td>
                  <td x-show="bg" x-text="$store.kamePanel.jobWord(e.job)"></td>
                  <td x-text="e.identity"></td>
                  <td x-text="e.key"></td>
                  <td x-text="$store.kamePanel.reasonText(e) + (e.code ? ' (' + e.code + ')' : '')"></td>
                  <td x-text="$store.kamePanel.seconds(e.seconds)"></td>
                </tr>
              </template>
            </tbody>
          </table>
          <details class="kame-dim" style="margin-top:8px">
            <summary>What each kind of row means</summary>
            <template x-for="m in $store.kamePanel.meanings" :key="m.kind">
              <div><b x-text="m.word"></b> - <span x-text="m.text"></span></div>
            </template>
          </details>
        </div>
      </template>
    </div>
  </template>
</div>
<style>
  .kame-panel { display: flex; flex-direction: column; gap: 0.7em; min-width: min(900px, 92vw); }
  .kame-stack { display: flex; flex-direction: column; gap: 0.8em; }
  .kame-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.6em; }
  .kame-title { font-size: 1.25em; font-weight: 600; }
  .kame-sub { font-size: 0.8em; opacity: 0.55; }
  .kame-status { display: flex; align-items: center; gap: 0.5em; font-size: 0.85em; opacity: 0.85; }
  .kame-dot { width: 0.6em; height: 0.6em; border-radius: 50%; background: #38bdf8; display: inline-block; }
  .kame-dot-warn { background: #f59e0b; }
  .kame-dot-bad { background: #ef4444; }
  .kame-bad, .kame-tone-bad { color: #ef4444; }
  .kame-tone-warn { color: #d99a2b; }
  .kame-tone-quiet { opacity: 0.6; }
  .kame-tabs { display: flex; flex-wrap: wrap; gap: 0.4em; }
  .kame-small { font-size: 0.85em; }
  .kame-mono { font-family: var(--font-family-code, monospace); }
  .kame-card { border: 1px solid var(--color-border, #444); border-radius: 8px; padding: 0.7em 0.9em; }
  .kame-card-title { font-weight: 600; margin-bottom: 0.2em; }
  .kame-card p { margin: 0.3em 0; }
  .kame-now { border: 1px solid var(--color-border, #444); border-radius: 8px; padding: 0.9em 1em; }
  .kame-now-bad { border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.06); }
  .kame-now-1 { font-size: 1.05em; margin: 0; overflow-wrap: anywhere; }
  .kame-now-2 { margin: 0.3em 0 0; }
  .kame-now-3 { margin: 0.15em 0 0; }
  .kame-now-note { margin: 0.3em 0 0; }
  .kame-dim { opacity: 0.65; font-weight: normal; }
  .kame-error { color: var(--color-error, #e55); }
  .kame-note { opacity: 0.85; font-style: italic; }
  .kame-waiting { border-color: var(--color-warning, #d90); }
  .kame-rings { display: flex; flex-wrap: wrap; gap: 0.3em; margin: 0.5em 0; align-items: flex-start; }
  .kame-ring-slot { display: flex; align-items: center; gap: 0.2em; }
  .kame-arrow { font-size: 1.4em; }
  .kame-ring { display: flex; flex-direction: column; align-items: center; gap: 0.25em; width: 10.5em; padding: 0.5em;
               text-align: center; border: 1px solid transparent; border-radius: 8px; background: transparent; color: inherit; cursor: pointer; }
  .kame-ring:hover { background: rgba(127, 127, 127, 0.12); }
  .kame-ring-open { border-color: var(--color-border, #666); background: rgba(127, 127, 127, 0.15); }
  .kame-ring-small { width: 8em; }
  .kame-ring-art svg { width: 7em; height: 7em; color: inherit; }
  .kame-ring-small .kame-ring-art svg { width: 5em; height: 5em; }
  .kame-ring-name { font-size: 0.8em; font-weight: 500; overflow-wrap: anywhere; }
  .kame-ring-word { font-size: 0.72em; line-height: 1.3; }
  .kame-ring-side { font-size: 0.68em; }
  .kame-legend { display: flex; flex-wrap: wrap; gap: 0.3em 1.2em; }
  .kame-legend-item { display: inline-flex; align-items: center; gap: 0.3em; }
  .kame-legend-svg { width: 1.6em; height: 0.7em; }
  .kame-keytable { margin-top: 0.7em; border: 1px solid var(--color-border, #444); border-radius: 8px; padding: 0.7em; }
  .kame-keylist { list-style: none; padding: 0; margin: 0.4em 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(16em, 1fr)); gap: 0.2em 1.5em; font-size: 0.85em; }
  .kame-keylist li { display: flex; justify-content: space-between; gap: 0.5em; }
  .kame-glyph { margin-right: 0.35em; }
  .kame-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em; margin: 0.5em 0; }
  .kame-confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em; margin-top: 0.4em; }
  .kame-moves { list-style: none; padding: 0; margin: 0.3em 0 0.5em; display: flex; flex-direction: column; gap: 0.25em; }
  .kame-moves li { display: flex; justify-content: space-between; gap: 1em; }
  .kame-moves li > span:first-child { overflow-wrap: anywhere; }
  .kame-details-toggle { align-self: flex-start; background: transparent; border: 0; padding: 0.2em 0; cursor: pointer; color: inherit;
                         font-size: 0.8em; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75; }
  .kame-details { display: flex; flex-direction: column; gap: 0.6em; }
  .kame-keygroup { margin: 0.5em 0; }
  .kame-keyrow { margin: 0.2em 0 0.2em 1em; }
  .kame-models { overflow-wrap: anywhere; margin-left: 1.3em; }
  .kame-poolline { margin: 0.15em 0; }
  .kame-counters { display: flex; flex-wrap: wrap; gap: 1.2em; margin: 0.2em 0; }
  .kame-setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.3em 1em; padding: 0.5em 0; border-top: 1px solid rgba(127, 127, 127, 0.18); }
  .kame-setting-title { font-weight: 500; margin-right: 0.5em; }
  .kame-setting-control { display: flex; align-items: center; gap: 0.5em; justify-content: flex-end; }
  .kame-setting-help { grid-column: 1 / -1; }
  .kame-choices { display: inline-flex; border: 1px solid var(--color-border, #666); border-radius: 6px; overflow: hidden; }
  .kame-choice { padding: 0.3em 0.8em; border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 0.85em; opacity: 0.7; }
  .kame-choice-on { background: rgba(127, 127, 127, 0.25); opacity: 1; }
  .kame-howto { border: 1px solid rgba(127, 127, 127, 0.3); border-radius: 6px; padding: 0.5em 0.8em; margin: 0.4em 0; }
  .kame-fb { list-style: none; padding: 0; margin: 0.5em 0; display: flex; flex-direction: column; gap: 0.5em; }
  .kame-fb-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em; }
  .kame-fb-n { width: 1.8em; text-align: right; opacity: 0.6; }
  .kame-fb-provider { min-width: 11em; max-width: 14em; }
  .kame-fb-model { position: relative; flex: 1 1 18em; min-width: 14em; }
  .kame-fb-model input { width: 100%; }
  .kame-fb-results { position: absolute; z-index: 20; left: 0; right: 0; top: 100%; max-height: 14em; overflow-y: auto;
                     background: var(--color-panel, #222); border: 1px solid var(--color-border, #666); border-radius: 6px; }
  .kame-fb-item { padding: 0.3em 0.6em; cursor: pointer; font-size: 0.85em; overflow-wrap: anywhere; }
  .kame-fb-item:hover { background: rgba(127, 127, 127, 0.18); }
  .kame-fb-matched { font-weight: 600; }
  .kame-fb-tools { display: inline-flex; gap: 0.3em; }
  .kame-fb-hint { flex-basis: 100%; padding-left: 2.3em; }
  .kame-fb-draft { opacity: 0.9; }
  .kame-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
  .kame-table th, .kame-table td { text-align: left; padding: 0.25em 0.4em; border-bottom: 1px solid var(--color-border, #333); vertical-align: top; }
  .kame-table tr.kame-good td { opacity: 0.8; }
  .kame-panel textarea { width: 100%; min-width: 16em; font-family: monospace; }
</style>
</body>
</html>
