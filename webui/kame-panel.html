<html>
<head>
  <title>KAME - API key rotation</title>
  <script type="module">
    import { store } from "/plugins/api_rotation_by_kame/webui/kame-panel-store.js";
  </script>
</head>
<body>
<div x-data>
  <template x-if="$store.kamePanel">
    <div class="kame-panel" x-create="$store.kamePanel.onOpen()" x-destroy="$store.kamePanel.cleanup()">

      <div class="kame-tabs">
        <template x-for="t in [['overview','Overview'],['events','Events'],['background','Background jobs'],['fallback','Fallback models'],['settings','Settings']]" :key="t[0]">
          <button class="btn" :class="$store.kamePanel.tab === t[0] ? 'btn-ok' : ''"
                  @click="$store.kamePanel.tab = t[0]" x-text="t[1]"></button>
        </template>
      </div>

      <div class="kame-error" x-show="$store.kamePanel.error" x-text="$store.kamePanel.error"></div>
      <div class="kame-note" x-show="$store.kamePanel.message" x-text="$store.kamePanel.message"></div>

      <!-- Overview -->
      <div x-show="$store.kamePanel.tab === 'overview'">
        <div class="section-title">
          KAME <span x-text="$store.kamePanel.data?.version || ''"></span>
          <span class="kame-dim" x-text="$store.kamePanel.data?.active ? '· rotating' : '· not rotating (Agent Zero runs natively)'"></span>
        </div>
        <div class="section-description" x-show="!$store.kamePanel.pools.length">
          No call has gone through KAME yet. Put two or more keys in a provider's
          key field (see <i>Your API keys</i> below) and talk to the agent.
        </div>
        <template x-for="pool in $store.kamePanel.pools" :key="pool.identity">
          <div class="kame-card">
            <div class="kame-card-title" x-text="pool.identity"></div>
            <div x-text="$store.kamePanel.poolLine(pool)"></div>
          </div>
        </template>

        <div class="kame-counters">
          <div><b x-text="$store.kamePanel.speed.model_switches || 0"></b> Fallbacks</div>
          <div><b x-text="$store.kamePanel.speed.backups || 0"></b> Backup keys started
            (<span x-text="$store.kamePanel.speed.backup_wins || 0"></span> won)</div>
          <div><b x-text="$store.kamePanel.speed.probe_bursts || 0"></b> Keys asked together</div>
        </div>
        <div class="kame-card" x-show="$store.kamePanel.speed.last_model_switch?.to">
          Last fallback: <b x-text="$store.kamePanel.speed.last_model_switch?.to"></b>
          answered for <span x-text="$store.kamePanel.speed.last_model_switch?.from"></span>
          (<span x-text="$store.kamePanel.speed.last_model_switch?.reason"></span>,
          <span x-text="$store.kamePanel.clock($store.kamePanel.speed.last_model_switch?.at)"></span>).
        </div>

        <template x-for="f in $store.kamePanel.inFlight" :key="f.started + f.identity">
          <div class="kame-card kame-waiting">
            Still waiting: <b x-text="$store.kamePanel.jobWord(f.job)"></b> on
            <span x-text="f.identity"></span> for <span x-text="$store.kamePanel.seconds(f.seconds)"></span>,
            <span x-text="f.refusals"></span> refusal(s)<span x-show="f.last">, last: <span x-text="f.last"></span></span>.
          </div>
        </template>

        <div class="kame-card" x-show="$store.kamePanel.seams.rows.length">
          <div class="kame-card-title">Agent Zero, as KAME found it</div>
          <template x-for="r in $store.kamePanel.seams.rows" :key="r.name">
            <div><span x-text="r.ok ? '\u2713' : '\u26a0'"></span> <code x-text="r.name"></code>
              <span class="kame-dim" x-show="!r.ok" x-text="'missing: ' + (r.missing || []).join(', ')"></span></div>
          </template>
          <div class="kame-dim" x-text="$store.kamePanel.seams.factory ? 'model factory found: the fallback list can build models' : 'model factory not found: the fallback list is skipped'"></div>
        </div>

        <div class="kame-card" x-show="$store.kamePanel.replies.length">
          <div class="kame-card-title">Last replies</div>
          <div class="kame-dim">The model that wrote each of the last replies (each step of a reply that uses
            tools counts), its first word and its whole time. A model from your fallback list says which model
            it answered for.</div>
          <template x-for="(r, i) in $store.kamePanel.replies" :key="i">
            <div>
              <code x-text="r.model"></code>
              <span style="color:#d4a017" x-show="r.for" x-text="'for ' + r.for"></span>
              <span x-text="'first word ' + (r.first_s == null ? '-' : r.first_s.toFixed(1) + ' s') + ' · ' + r.total_s.toFixed(1) + ' s total'"></span>
            </div>
          </template>
        </div>

        <div class="section-title">Your API keys</div>
        <div class="section-description">
          KAME rotates the keys Agent Zero already has. Put several keys of one
          provider in that provider's API key field, separated by commas
          (Settings &gt; API keys), or in <code>usr/.env</code> as
          <code>API_KEY_GOOGLE=key1,key2,key3</code>. From the chat:
          <code>/kame-keys add google key1,key2</code> or
          <code>/kame-keys import</code> with a pasted .env. Keys from
          different accounts each bring their own quota. KAME never shows a key:
          the panel names each one by a short fingerprint.
        </div>
      </div>

      <!-- Events / Background jobs -->
      <template x-for="bg in [false, true]" :key="String(bg)">
        <div x-show="$store.kamePanel.tab === (bg ? 'background' : 'events')">
          <div class="section-description" x-text="bg
            ? 'Agent Zero\'s calls behind the scenes: memory, chat titles, summaries and compression. Kept apart so they never bury your conversation.'
            : 'What KAME decided for your conversation, newest first.'"></div>
          <div class="section-description" x-show="!$store.kamePanel.events(bg).length">Nothing yet.</div>
          <table class="kame-table" x-show="$store.kamePanel.events(bg).length">
            <thead><tr><th>When</th><th>What</th><th x-show="bg">Job</th><th>Model</th><th>Key</th><th>Why</th><th>Rest</th></tr></thead>
            <tbody>
              <template x-for="e in $store.kamePanel.events(bg)" :key="e.seq">
                <tr :class="$store.kamePanel.good(e.kind) ? 'kame-good' : ''">
                  <td x-text="$store.kamePanel.clock(e.at)"></td>
                  <td x-text="$store.kamePanel.kindWord(e.kind)"></td>
                  <td x-show="bg" x-text="$store.kamePanel.jobWord(e.job)"></td>
                  <td x-text="e.identity"></td>
                  <td x-text="e.key"></td>
                  <td x-text="$store.kamePanel.reasonText(e) + (e.code ? ' (' + e.code + ')' : '')"></td>
                  <td x-text="$store.kamePanel.seconds(e.seconds)"></td>
                </tr>
              </template>
            </tbody>
          </table>
          <details class="kame-dim" style="margin-top:8px">
            <summary>What each kind of row means</summary>
            <template x-for="m in $store.kamePanel.meanings" :key="m.kind">
              <div><b x-text="m.word"></b> - <span x-text="m.text"></span></div>
            </template>
          </details>
        </div>
      </template>

      <!-- Fallback models -->
      <div x-show="$store.kamePanel.tab === 'fallback'">
        <div class="section-description">
          Agent Zero has no fallback list of its own, so KAME keeps one. When your
          chat model cannot answer - every key resting longer than the time
          below, the provider has no server for it, two timeouts in a row, every
          key refused it - and nothing has been shown yet, KAME answers with the
          first model here that can. The next reply starts on your model again.
          Background jobs never switch model. Empty list: nothing ever switches.
        </div>
        <template x-for="(m, i) in $store.kamePanel.fallbackModels" :key="m.identity">
          <div class="kame-card"><b x-text="(i + 1) + '.'"></b> <span x-text="m.label"></span>
            <span class="kame-dim" x-show="m.api_base" x-text="'@ ' + m.api_base"></span></div>
        </template>
        <div class="field">
          <div class="field-label">
            <div class="field-title">Fallback models, in order</div>
            <div class="field-description">One <code>provider/model</code> per line, with Agent Zero's
              provider ids (as in the model settings). Optional <code>@ api_base</code>.
              Each uses the keys Agent Zero has for its provider.</div>
          </div>
          <div class="field-control">
            <textarea rows="5" placeholder="openrouter/meta-llama/llama-4-maverick&#10;groq/llama-3.3-70b-versatile"
                      :value="$store.kamePanel.value('fallback_models')"
                      @input="$store.kamePanel.draft('fallback_models', $event.target.value)"></textarea>
            <button class="btn btn-ok" @click="$store.kamePanel.save('fallback_models', $store.kamePanel.value('fallback_models'))">Save list</button>
          </div>
        </div>
        <div class="field">
          <div class="field-label">
            <div class="field-title">Switch to the next model after (seconds)</div>
            <div class="field-description">How long every key of your model may rest before the next model answers. 0 = never switch.</div>
          </div>
          <div class="field-control">
            <input type="number" min="0" max="3600" :value="$store.kamePanel.value('failover_after_seconds')"
                   @input="$store.kamePanel.draft('failover_after_seconds', $event.target.value)"
                   @change="$store.kamePanel.save('failover_after_seconds', $event.target.value)" />
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div x-show="$store.kamePanel.tab === 'settings'">
        <div class="section-description">
          KAME works with none of these touched. The ones most people want are
          on show; everything else is under <i>Show advanced settings</i>.
        </div>
        <template x-for="group in ['visible', 'advanced', 'troubleshooting']" :key="group">
          <div x-show="group === 'visible' || $store.kamePanel.showAdvanced">
            <div class="section-title" x-show="group !== 'visible'"
                 x-text="group === 'advanced' ? 'Advanced' : 'Troubleshooting (turns parts of KAME off)'"></div>
            <template x-for="m in $store.kamePanel.settingsIn(group)" :key="m.name">
              <div class="field">
                <div class="field-label">
                  <div class="field-title" x-text="m.title"></div>
                  <div class="field-description">
                    <span x-text="m.sentence"></span>
                    <code x-text="m.name"></code>
                    <span class="kame-dim" x-show="m.env_override" x-text="'(set by ' + m.env_override + ' in the environment)'"></span>
                  </div>
                </div>
                <div class="field-control">
                  <template x-if="m.type === 'flag'">
                    <label class="toggle">
                      <input type="checkbox" :checked="!!$store.kamePanel.value(m.name)"
                             @change="$store.kamePanel.save(m.name, $event.target.checked)" />
                      <span class="toggler"></span>
                    </label>
                  </template>
                  <template x-if="m.type === 'choice'">
                    <select @change="$store.kamePanel.save(m.name, $event.target.value)">
                      <template x-for="c in $store.kamePanel.choicesOf(m)" :key="c">
                        <option :value="c" :selected="String($store.kamePanel.value(m.name)) === c"
                                x-text="$store.kamePanel.choiceLabel(m, c)"></option>
                      </template>
                    </select>
                  </template>
                  <template x-if="m.type === 'number'">
                    <input type="number" :min="m.low" :max="m.high" :value="$store.kamePanel.value(m.name)"
                           @input="$store.kamePanel.draft(m.name, $event.target.value)"
                           @change="$store.kamePanel.save(m.name, $event.target.value)" />
                  </template>
                  <template x-if="m.type === 'text'">
                    <button class="btn" @click="$store.kamePanel.tab = 'fallback'">Edit in Fallback models</button>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
        <button class="btn" @click="$store.kamePanel.showAdvanced = !$store.kamePanel.showAdvanced"
                x-text="$store.kamePanel.showAdvanced ? 'Hide advanced settings' : 'Show advanced settings'"></button>
      </div>
    </div>
  </template>
</div>
<style>
  .kame-panel { display: flex; flex-direction: column; gap: 0.6em; min-width: min(900px, 92vw); }
  .kame-tabs { display: flex; flex-wrap: wrap; gap: 0.4em; }
  .kame-card { border: 1px solid var(--color-border, #444); border-radius: 6px; padding: 0.5em 0.7em; margin: 0.3em 0; }
  .kame-card-title { font-weight: 600; }
  .kame-counters { display: flex; flex-wrap: wrap; gap: 1.2em; margin: 0.5em 0; }
  .kame-dim { opacity: 0.65; font-weight: normal; }
  .kame-error { color: var(--color-error, #e55); }
  .kame-note { opacity: 0.85; font-style: italic; }
  .kame-waiting { border-color: var(--color-warning, #d90); }
  .kame-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
  .kame-table th, .kame-table td { text-align: left; padding: 0.25em 0.4em; border-bottom: 1px solid var(--color-border, #333); vertical-align: top; }
  .kame-table tr.kame-good td { opacity: 0.8; }
  .kame-panel textarea { width: 100%; min-width: 22em; font-family: monospace; }
</style>
</body>
</html>
