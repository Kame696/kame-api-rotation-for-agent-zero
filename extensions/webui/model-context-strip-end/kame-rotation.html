<!--
  KAME rotation chip - v1.6.0.1, redrawn in 1.8.2.9.

  Lives in Agent Zero v2.11's `model-context-strip-end` WebUI plugin slot, a
  couple of centimetres from where the person types. That placement is the whole
  point: rotation used to be visible only in a console, and a pool waiting out a
  quota was indistinguishable from a hung agent to anyone watching the chat.

  The composer PLACEHOLDER was considered for this and rejected - it disappears
  the moment somebody types, which is exactly when they are waiting and reaching
  for the keyboard. The chip is in the same place and survives typing.

  1.8.2.9: one ring with a segment per key, the same count as the status line and
  the API Rotation page (all three read one view), keys grouped by provider and
  by key with the full model names, repeated decisions as one line.

  Counts and fingerprints only. The endpoint behind this cannot return a key.
-->
<script type="module">
  import { store } from "/plugins/api_rotation_by_kame/webui/kame-rotation-store.js";
</script>

<div x-data>
  <template x-if="$store.kameRotation && ($store.preferences?.isUiControlVisible?.('kameRotation') ?? true)">
    <div class="kame-rot-anchor"
         x-create="$store.kameRotation.onMount($watch)"
         x-destroy="$store.kameRotation.cleanup()"
         @click.outside="$store.kameRotation.open = false"
         @keydown.escape.window="$store.kameRotation.open = false">

      <button type="button"
              class="kame-rot-button"
              :class="'kame-rot-' + $store.kameRotation.view.tone"
              :aria-expanded="$store.kameRotation.open"
              :aria-label="$store.kameRotation.view.aria"
              :title="$store.kameRotation.view.tip"
              @click="$store.kameRotation.toggle()">
        <span class="kame-rot-ring" x-html="$store.kameRotation.view.ring"></span>
        <span class="kame-rot-label" x-text="$store.kameRotation.view.label"></span>
      </button>

      <div class="kame-rot-popover"
           x-show="$store.kameRotation.open"
           x-transition.opacity
           style="display: none;"
           role="dialog"
           aria-label="API Rotation">

        <div class="kame-rot-header">
          <strong>API Rotation</strong>
          <span class="kame-rot-version"
                x-text="'KAME ' + ($store.kameRotation.view.version || '')"></span>
        </div>

        <div class="kame-rot-headline"
             :class="'kame-rot-' + $store.kameRotation.view.tone"
             x-text="$store.kameRotation.view.headline"></div>
        <div class="kame-rot-counts" x-show="$store.kameRotation.view.counts"
             x-text="$store.kameRotation.view.counts"></div>
        <div class="kame-rot-headline kame-rot-warn"
             x-show="$store.kameRotation.view.said && $store.kameRotation.view.said.tone !== 'good'"
             x-text="$store.kameRotation.view.said ? $store.kameRotation.view.said.line2 : ''"></div>
        <button class="kame-rot-open-panel" type="button"
                @click="ensureModalOpen('/plugins/api_rotation_by_kame/webui/main.html')">Open API Rotation</button>

        <template x-if="!$store.kameRotation.view.providers.length">
          <div class="kame-rot-empty">
            KAME learns your keys on the first model call of a chat. Nothing here
            yet is not a fault.
          </div>
        </template>

        <template x-for="prov in $store.kameRotation.view.providers" :key="prov.provider">
          <div class="kame-rot-pool">
            <div class="kame-rot-pool-head">
              <span class="kame-rot-pool-name" x-text="prov.provider"></span>
              <span class="kame-rot-pool-count"
                    x-text="prov.keyCount + (prov.keyCount === 1 ? ' key' : ' keys')"></span>
            </div>
            <template x-for="row in prov.rows" :key="row.fingerprint + row.code + row.words">
              <div class="kame-rot-key" :class="'kame-rot-key-' + row.code">
                <div class="kame-rot-key-line">
                  <span class="kame-rot-key-id"><span class="kame-rot-glyph" :style="'color:' + row.colour" x-text="row.glyph"></span><span x-text="row.fingerprint"></span></span>
                  <span class="kame-rot-key-note" x-text="row.words"></span>
                </div>
                <div class="kame-rot-key-models" x-text="row.modelsLine"></div>
              </div>
            </template>
          </div>
        </template>

        <template x-if="$store.kameRotation.view.moves.length">
          <div class="kame-rot-events">
            <div class="kame-rot-events-head">Last decisions</div>
            <template x-for="(mv, i) in $store.kameRotation.view.moves" :key="i">
              <div class="kame-rot-event">
                <span class="kame-rot-event-icon" aria-hidden="true" x-text="mv.icon"></span>
                <span class="kame-rot-event-why" x-text="mv.text"></span>
              </div>
            </template>
          </div>
        </template>

        <template x-if="$store.kameRotation.view.retired">
          <!--
            The one sentence in this panel that asks the reader to DO something.
            Retiring is not deleting: KAME never writes credentials, the row
            stays where it is, and a working key put in its place brings it back
            on the next successful call.
          -->
          <div class="kame-rot-action">
            Nothing was deleted - paste a working key over the retired one in
            your <code>.env</code> and it returns by itself.
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<style>
  .kame-rot-events {
    margin-top: 0.6rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--color-border, rgba(127, 127, 127, 0.25));
    font-size: 0.75rem;
  }
  .kame-rot-events-head {
    opacity: 0.7;
    margin-bottom: 0.3rem;
  }
  .kame-rot-event {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.4rem;
    align-items: baseline;
    padding: 0.1rem 0;
  }
  .kame-rot-event-icon { opacity: 0.6; }
  /* A decision is a sentence: it wraps, it is never cut. */
  .kame-rot-event-why { overflow-wrap: anywhere; }
  .kame-rot-anchor {
    position: static;
    display: flex;
    align-items: center;
  }
  .kame-rot-button {
    position: relative;
    display: grid;
    place-items: center;
    width: 1.8rem;
    height: 1.8rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--color-text);
    cursor: pointer;
    opacity: .82;
  }
  .kame-rot-button:hover {
    background: var(--color-background-hover);
    opacity: 1;
  }
  .kame-rot-ring {
    position: absolute;
    inset: 1px;
    display: block;
  }
  /* the arcs already start at 12 o'clock */
  .kame-rot-ring svg {
    width: 100%;
    height: 100%;
  }
  .kame-rot-label {
    position: relative;
    z-index: 1;
    font-family: var(--font-family-main);
    font-size: .42rem;
    font-weight: 600;
    letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
  }

  .kame-rot-popover {
    position: absolute;
    right: 0;
    bottom: calc(100% + 6px);
    z-index: 1050;
    width: min(23rem, calc(100vw - 2rem));
    max-height: min(32rem, 72vh);
    overflow-y: auto;
    padding: .9rem;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    background-color: color-mix(in srgb, var(--color-panel) 90%, black 10%);
    box-shadow: 0 16px 38px rgba(0, 0, 0, .3);
  }
  .kame-rot-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: .75rem;
    font-size: .86rem;
  }
  .kame-rot-version {
    font-family: var(--font-family-code);
    font-size: .7rem;
    color: color-mix(in srgb, var(--color-text) 55%, transparent);
  }
  .kame-rot-headline {
    margin: .45rem 0 .2rem;
    font-size: .8rem;
    color: color-mix(in srgb, var(--color-text) 85%, transparent);
    overflow-wrap: anywhere;
  }
  .kame-rot-counts {
    margin: 0 0 .5rem;
    font-size: .74rem;
    color: color-mix(in srgb, var(--color-text) 66%, transparent);
  }
  .kame-rot-headline.kame-rot-warn { color: #d99a2b; }
  .kame-rot-headline.kame-rot-bad  { color: #d9534f; }
  .kame-rot-empty {
    padding: .35rem 0 .15rem;
    color: color-mix(in srgb, var(--color-text) 62%, transparent);
    font-size: .78rem;
  }
  .kame-rot-pool {
    padding-top: .6rem;
    margin-top: .6rem;
    border-top: 1px solid var(--color-border);
  }
  .kame-rot-pool-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: .5rem;
    align-items: baseline;
    font-size: .8rem;
  }
  .kame-rot-pool-name {
    font-family: var(--font-family-code);
    overflow-wrap: anywhere;
  }
  .kame-rot-pool-count {
    font-variant-numeric: tabular-nums;
    color: color-mix(in srgb, var(--color-text) 72%, transparent);
  }
  .kame-rot-key {
    margin-top: .4rem;
    font-size: .72rem;
    color: color-mix(in srgb, var(--color-text) 72%, transparent);
  }
  .kame-rot-key-line {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: .5rem;
    align-items: baseline;
  }
  .kame-rot-key-id { font-family: var(--font-family-code); white-space: nowrap; }
  .kame-rot-glyph { margin-right: .35rem; }
  .kame-rot-key-note {
    text-align: right;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  /* The full model names that use this key: they wrap, they are never cut. */
  .kame-rot-key-models {
    margin-top: .1rem;
    padding-left: 1.1rem;
    font-size: .68rem;
    opacity: .8;
    overflow-wrap: anywhere;
  }
  .kame-rot-action {
    margin-top: .7rem;
    padding-top: .6rem;
    border-top: 1px solid var(--color-border);
    font-size: .74rem;
    color: color-mix(in srgb, var(--color-text) 78%, transparent);
  }
  .kame-rot-action code {
    font-family: var(--font-family-code);
    font-size: .95em;
  }
  .kame-rot-open-panel {
    margin: .2rem 0 .1rem;
    padding: .25rem .6rem;
    font-size: .74rem;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: transparent;
    color: var(--color-text);
    cursor: pointer;
  }
  .kame-rot-open-panel:hover { background: var(--color-background-hover); }
  @media (max-width: 25rem) {
    .kame-rot-popover {
      right: 1.25rem;
      width: min(18rem, calc(100vw - 3rem));
    }
  }
  .light-mode .kame-rot-popover {
    background: var(--color-panel);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
  }
</style>
