<!--
  KAME rotation chip - v1.6.0.1, redrawn in 1.8.2.9, popover redesigned in 1.8.3.1.

  Lives in Agent Zero v2.11's `model-context-strip-end` WebUI plugin slot, a
  couple of centimetres from where the person types. That placement is the whole
  point: rotation used to be visible only in a console, and a pool waiting out a
  quota was indistinguishable from a hung agent to anyone watching the chat.

  The composer PLACEHOLDER was considered for this and rejected - it disappears
  the moment somebody types, which is exactly when they are waiting and reaching
  for the keyboard. The chip is in the same place and survives typing.

  1.8.2.9: one ring with a segment per key, the same count as the status line and
  the API Rotation page (all three read one view).

  1.8.3.1 (D3): a click opens the popover, with the same sections and the same
  words as the Hermes popover: the header, one sentence in the state colour and
  the key count, "Your models" (a ring and ONE status per model), "Last replies"
  (one sentence each), the retired-key sentence and the button to the full page.
  What it says is `chipPopover()` in kame-view.js; this file only draws it. The
  per-key blocks left the popover; they stay on the full page.

  Counts and fingerprints only. The endpoint behind this cannot return a key.
-->
<script type="module">
  import { store } from "/plugins/api_rotation_by_kame/webui/kame-rotation-store.js";
</script>

<div x-data>
  <template x-if="$store.kameRotation && ($store.preferences?.isUiControlVisible?.('kameRotation') ?? true)">
    <div class="kame-rot-anchor"
         x-create="$store.kameRotation.onMount($watch)"
         x-destroy="$store.kameRotation.cleanup()"
         @click.outside="$store.kameRotation.open = false"
         @keydown.escape.window="$store.kameRotation.open = false">

      <button type="button"
              class="kame-rot-button"
              :class="'kame-rot-' + $store.kameRotation.view.tone"
              :aria-expanded="$store.kameRotation.open"
              :aria-label="$store.kameRotation.view.aria"
              :title="$store.kameRotation.view.tip"
              @click="$store.kameRotation.toggle()">
        <span class="kame-rot-ring" x-html="$store.kameRotation.view.ring"></span>
        <span class="kame-rot-label" x-text="$store.kameRotation.view.label"></span>
      </button>

      <div class="kame-rot-popover"
           x-data="{ get p() { return $store.kameRotation.popover; } }"
           :class="{ 'kame-rot-stale': p.stale }"
           x-show="$store.kameRotation.open"
           x-transition.opacity
           style="display: none;"
           role="dialog"
           aria-label="API Rotation">

        <div class="kame-rot-header">
          <strong x-text="p.title"></strong>
          <span class="kame-rot-version" x-text="p.version"></span>
        </div>

        <div class="kame-rot-sentence">
          <span class="kame-rot-dot" :class="'kame-rot-dot-' + p.tone" aria-hidden="true"></span>
          <span x-text="p.sentence"></span>
        </div>
        <div class="kame-rot-count" x-text="p.keysLine"></div>

        <template x-if="p.models.length">
          <div class="kame-rot-section">
            <div class="kame-rot-section-head">Your models</div>
            <template x-for="m in p.models" :key="m.identity">
              <div class="kame-rot-model">
                <span class="kame-rot-mring" x-html="m.ring"></span>
                <span class="kame-rot-mname" :title="m.identity" x-text="m.name"></span>
                <template x-for="tag in m.tags" :key="tag">
                  <span class="kame-rot-tag" x-text="tag"></span>
                </template>
                <span class="kame-rot-mstatus" :class="'kame-rot-t-' + m.tone" x-text="m.status"></span>
              </div>
            </template>
            <div class="kame-rot-more" x-show="p.more > 0" x-text="'+' + p.more + ' more'"></div>
          </div>
        </template>

        <div class="kame-rot-section">
          <div class="kame-rot-section-head">Last replies</div>
          <template x-for="(reply, i) in p.replies" :key="i">
            <div class="kame-rot-reply">
              <span class="kame-rot-rtime" x-text="reply.time"></span>
              <span class="kame-rot-rline" x-text="reply.line"></span>
            </div>
          </template>
          <div class="kame-rot-empty" x-show="!p.replies.length" x-text="p.emptyReplies"></div>
        </div>

        <!--
          The one sentence in this panel that asks the reader to DO something.
          Retiring is not deleting: KAME never writes credentials, the row
          stays where it is, and a working key put in its place brings it back
          on the next successful call.
        -->
        <div class="kame-rot-action" x-show="p.retired" x-text="p.retired"></div>

        <button class="kame-rot-open-panel" type="button"
                @click="$store.kameRotation.open = false; ensureModalOpen('/plugins/api_rotation_by_kame/webui/main.html')"
                >Open API Rotation</button>
      </div>
    </div>
  </template>
</div>

<style>
  .kame-rot-anchor {
    position: static;
    display: flex;
    align-items: center;
  }
  .kame-rot-button {
    position: relative;
    display: grid;
    place-items: center;
    width: 1.8rem;
    height: 1.8rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--color-text);
    cursor: pointer;
    opacity: .82;
  }
  .kame-rot-button:hover {
    background: var(--color-background-hover);
    opacity: 1;
  }
  .kame-rot-ring {
    position: absolute;
    inset: 1px;
    display: block;
  }
  /* the arcs already start at 12 o'clock */
  .kame-rot-ring svg {
    width: 100%;
    height: 100%;
  }
  .kame-rot-label {
    position: relative;
    z-index: 1;
    font-family: var(--font-family-main);
    font-size: .42rem;
    font-weight: 600;
    letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
  }

  .kame-rot-popover {
    position: absolute;
    right: 0;
    bottom: calc(100% + 6px);
    z-index: 1050;
    width: min(23rem, calc(100vw - 2rem));
    max-height: min(32rem, 72vh);
    overflow-y: auto;
    padding: .9rem;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    background-color: color-mix(in srgb, var(--color-panel) 90%, black 10%);
    box-shadow: 0 16px 38px rgba(0, 0, 0, .3);
  }
  /* an old reading is said to be old: the whole popover is dimmed */
  .kame-rot-popover.kame-rot-stale { opacity: .75; }
  .kame-rot-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: .75rem;
    font-size: .86rem;
  }
  .kame-rot-version {
    font-family: var(--font-family-code);
    font-size: .7rem;
    color: color-mix(in srgb, var(--color-text) 55%, transparent);
  }
  /* the sentence: a dot in the state colour (and the words say the same, so colour is never alone) */
  .kame-rot-sentence {
    display: flex;
    align-items: flex-start;
    gap: .45rem;
    margin: .55rem 0 .15rem;
    font-size: .8rem;
    color: color-mix(in srgb, var(--color-text) 90%, transparent);
    overflow-wrap: anywhere;
  }
  .kame-rot-dot {
    flex: none;
    width: .5rem;
    height: .5rem;
    margin-top: .3rem;
    border-radius: 50%;
    background: #8a8f98;
  }
  .kame-rot-dot-good { background: #38bdf8; }
  .kame-rot-dot-warn { background: #f59e0b; }
  .kame-rot-dot-bad { background: #ef4444; }
  .kame-rot-count {
    margin: 0 0 .2rem;
    padding-left: .95rem;
    font-size: .74rem;
    color: color-mix(in srgb, var(--color-text) 66%, transparent);
  }
  .kame-rot-section {
    margin-top: .7rem;
    padding-top: .55rem;
    border-top: 1px solid var(--color-border);
  }
  .kame-rot-section-head {
    margin-bottom: .25rem;
    font-size: .62rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--color-text) 55%, transparent);
  }
  .kame-rot-model {
    display: flex;
    align-items: center;
    gap: .45rem;
    margin-top: .3rem;
    font-size: .76rem;
  }
  .kame-rot-mring { flex: none; width: 1rem; height: 1rem; }
  .kame-rot-mring svg { width: 100%; height: 100%; display: block; }
  .kame-rot-mname {
    flex: 1 1 auto;
    min-width: 0;
    font-family: var(--font-family-code);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kame-rot-tag {
    flex: none;
    padding: 0 .3rem;
    border-radius: 4px;
    font-size: .62rem;
    background: color-mix(in srgb, var(--color-text) 12%, transparent);
    color: color-mix(in srgb, var(--color-text) 72%, transparent);
  }
  .kame-rot-mstatus {
    flex: none;
    font-variant-numeric: tabular-nums;
    color: color-mix(in srgb, var(--color-text) 78%, transparent);
  }
  .kame-rot-t-warn { color: #f59e0b; }   /* the Hermes popover's amber and red (review R15) */
  .kame-rot-t-bad { color: #ef4444; }
  .kame-rot-t-quiet { color: color-mix(in srgb, var(--color-text) 50%, transparent); }
  .kame-rot-more {
    margin-top: .3rem;
    font-size: .72rem;
    color: color-mix(in srgb, var(--color-text) 55%, transparent);
  }
  .kame-rot-reply {
    display: flex;
    gap: .5rem;
    margin-top: .25rem;
    font-size: .74rem;
    color: color-mix(in srgb, var(--color-text) 82%, transparent);
  }
  .kame-rot-rtime {
    flex: none;
    font-variant-numeric: tabular-nums;
    color: color-mix(in srgb, var(--color-text) 50%, transparent);
  }
  /* a reply is a sentence: it wraps, it is never cut */
  .kame-rot-rline { overflow-wrap: anywhere; }
  .kame-rot-empty {
    padding: .1rem 0;
    color: color-mix(in srgb, var(--color-text) 55%, transparent);
    font-size: .74rem;
  }
  .kame-rot-action {
    margin-top: .7rem;
    padding-top: .6rem;
    border-top: 1px solid var(--color-border);
    font-size: .74rem;
    color: #ef4444;
  }
  .kame-rot-open-panel {
    width: 100%;
    margin-top: .7rem;
    padding: .3rem .6rem;
    font-size: .76rem;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: transparent;
    color: var(--color-text);
    cursor: pointer;
  }
  .kame-rot-open-panel:hover { background: var(--color-background-hover); }
  @media (max-width: 25rem) {
    .kame-rot-popover {
      right: 1.25rem;
      width: min(18rem, calc(100vw - 3rem));
    }
  }
  .light-mode .kame-rot-popover {
    background: var(--color-panel);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
  }
</style>
