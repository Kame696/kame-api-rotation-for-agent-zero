# KAME API Rotation — default settings.
# Override in the Plugin Settings UI. These are pure configuration; the
# rotation/selection algorithm is unaffected by them.

# Log verbosity: silent | normal | verbose | verbose+errors
#   silent          — no routine output, hard errors only (invisible in Docker log)
#   normal          — one line per successful call + rotations/limits/sleeps (default)
#   verbose         — adds heartbeat, per-call timing, full pool snapshot + summary
#   verbose+errors  — everything in verbose PLUS the full raw exception on every
#                     failure (so the actual error shows in the Docker log, not just
#                     KAME's one-line classification). Same as verbose with
#                     kame_log_full_errors turned on, in one pick. (v1.0.4)
# (Legacy "verbose_trace: true" still maps to "verbose".)
kame_log_level: normal

# Cooldown (seconds) for a key hit by a DAILY-quota or ACCOUNT/out-of-credit
# limit, on any provider. Overrides a misleadingly short retry hint (e.g.
# Google's "1s" on a daily 429) and is the ceiling for the adaptive backoff.
# Per-minute limits are unaffected. Default 3600 (1h). Range 1–86400 (24h).
daily_quota_cooldown_seconds: 3600

# v1.8.0.0. No key sits out longer than this, whatever caused the hold: the
# provider's own stated wait, the daily cooldown above, or KAME's escalation.
# Past it the key is simply tried again. Default 3600 (1h). Range 60-86400.
# Environment override: KAME_MAX_HOLD.
max_hold_seconds: 3600

# v1.8.0.2. How long a key rests after a rate limit that names no wait at all.
# Measured: retried within 30s, a refused key answered 0 of 73 times.
# Default 30. Range 0-300 (0 = offer the key again at once).
# Environment override: KAME_UNSIZED_REST.
unsized_throttle_rest_seconds: 30

# v1.8.1.0. Gemini's bare 429 RESOURCE_EXHAUSTED (no retryDelay, no quotaId):
# rest the refused key 1s, then 2, 4, 8, 16, 32, 64s on each repeat, back to 1s
# the moment it answers, instead of the flat rest above. A number the provider
# states is always obeyed. Only that exact error. Default on.
# Environment override: KAME_UNSIZED_BACKOFF (0 = off).
unsized_throttle_backoff: true

# Where that ladder stops growing. Default 64. Range 1-3600.
# Environment override: KAME_UNSIZED_BACKOFF_MAX.
unsized_backoff_max_seconds: 64

# How API keys appear in logs:
#   fingerprint — anonymized stable id like "k3f9a1" (default; never leaks)
#   prefix8     — first 8 chars of the key (mild partial leak)
#
# v1.6.0.1 REMOVED the third option, `full`, which wrote the entire secret into
# the log. Agent Zero v2.11 masks secrets in its own error output, so KAME's
# switch had become the only thing in the stack that deliberately un-redacted a
# credential — and a log ends up in bug reports and screenshots taken by people
# who are not thinking about what is in it. An existing config that still says
# `full` keeps working and is read as `prefix8`.
#
# If you turned it on to see which key failed, the setting you actually want is
# `kame_log_full_errors` below: it prints the provider's untruncated message
# beside KAME's classification, and an invalid-key line already shows a head
# and a tail of the key so you can find it in your provider console.
key_log_style: fingerprint

# Show the ENTIRE raw error on every failed call (debug). Off by default.
# When true, each failure ALSO logs the raw exception — its type, status code,
# retry attributes and the FULL untruncated message — right beside the
# classification KAME gave it (kind + applied cooldown). Use this to VERIFY
# there is no misclassification (e.g. a "503 server-busy" that is really a
# quota or network error). Independent of kame_log_level (works even with
# 'silent'), and it never changes rotation/cooldown behavior — pure data.
kame_log_full_errors: false

# Floor for Agent Zero's "consecutive unusable response limit".
# A0 v2.4+ aborts a turn after N consecutive UNPARSEABLE model outputs
# (fw.msg_misformat / fw.msg_repeat), stating the reason as "to prevent further
# API charges". With a rotated key pool that reason is much weaker, and A0 has
# itself moved the number: the default was 2 in v2.4-v2.7 and 5 in v2.8 — but a
# settings.json written by an older A0 keeps 2 forever, so one JSON-escaping
# slip from the model ends the turn.
# KAME applies this as a FLOOR, never a ceiling:
#     effective limit = max(A0's setting, this value)
# It is not a bypass: once this many unusable responses pile up, A0's abort is
# left alone, so a model stuck in a formatting loop cannot drain the pool.
# Default 5 (A0 v2.8's own default). Set 0 to never interfere.
kame_unusable_response_limit: 5

# Collapse repetitive 503-storm logs. On by default. During a sustained outage
# the per-rotation failure lines are near-identical and can number in the
# hundreds (one real Gemini outage logged 1,063 of them in 83 min). When true,
# at 'normal' level KAME prints the FIRST failure of a storm, then collapses the
# repeats into ONE aggregate line every ~20s plus a "storm over" recap on
# recovery — so the log stays readable. 'verbose' still prints every line, and
# kame_log_full_errors overrides this (shows every line). Set false to restore
# one line per failure at 'normal'. Pure observability — rotation is unchanged.
kame_collapse_storm_logs: true

# Tell the user, in the chat, when every key in a pool is cooling. On by
# default. KAME already announces a long wait on the console — which is not
# where the person waiting is looking, so a pool waiting out a daily quota is
# indistinguishable from a hung agent, and the only move that looks available
# is restarting Agent Zero (throwing the wait and the context away). When true,
# a wait longer than ~90s puts ONE log item in the chat and keeps it updated:
# how many keys are resting, when the earliest is expected back, how long it
# has run, and that stop still works. Counts and the pool name only — never a
# key — and UI-only, so it never enters the model's history. Pure
# observability: rotation, cooldowns and give-up behavior are unchanged.
#
# v1.6.0.1: this now governs TWO surfaces, because ninety seconds turned out to
# be the wrong and only threshold. With a real pool the whole thing is rarely
# cold for ninety seconds at once, so in practice the chat item almost never
# appeared and the reasonable conclusion was that nothing was working.
#   * a live notification at ~15s, pushed over the WebSocket, updating itself
#     in place and closing as "a key came back" or "stopped waiting";
#   * the ~90s chat item, unchanged, because that one writes a permanent row
#     into the conversation and a row per twenty-second throttle would bury it.
# Turning this off silences both. The always-on rotation indicator beside the
# composer is separate and is toggled from Agent Zero's own interface controls.
kame_wait_notice: true

# ---------------------------------------------------------------------------
# v1.8.1.0: the rest of the Hermes port's settings. Same names, same
# environment variables, same defaults. `/kame get` lists every one with its
# current value; `/kame set <name> <value>` changes one without this page.
# ---------------------------------------------------------------------------

# Keep key holds on disk (usr/plugin-data/api_rotation_by_kame/pool-health.json)
# so restarting Agent Zero does not spend calls on keys already known to be out.
# A hash of each key, never the key; never longer than max_hold_seconds; a
# missing or damaged file is ignored. Default on.
# Environment override: KAME_SHARE_POOL_HEALTH.
share_pool_health: true

# Stop writing refusals.jsonl (each refusal a provider sent, keys removed,
# 8 MB at most, decides nothing). Default off - the recorder runs.
# Environment override: KAME_RECORDER_DISABLED.
refusal_recorder_disabled: false

# Stop writing calls.jsonl (one line per attempt: durations, outcome, a key
# fingerprint - no key, prompt or answer; 4 MB at most). Default off.
# Environment override: KAME_CALL_TIMINGS_DISABLED.
call_timings_disabled: false

# Turn KAME off without uninstalling it: every call goes to Agent Zero exactly
# as if the plugin were not there. Environment override: KAME_ROTATION_DISABLED.
rotation_disabled: false

# Keep the cooldowns but use the first ready key in the order written instead
# of the least-loaded one. Environment override: KAME_SPREAD_DISABLED.
spread_disabled: false

# One attempt per call: the refused key is still rested, the error goes back to
# Agent Zero instead of KAME trying the next key.
# Environment override: KAME_CAROUSEL_DISABLED.
carousel_disabled: false
