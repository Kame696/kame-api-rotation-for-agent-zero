# KAME API Rotation — default settings.
# Override in the Plugin Settings UI. These are pure configuration; the
# rotation/selection algorithm is unaffected by them.

# Log verbosity: silent | normal | verbose
#   silent  — no routine output, hard errors only (invisible in the Docker log)
#   normal  — one line per successful call + rotations/limits/sleeps (default)
#   verbose — adds heartbeat, per-call timing, full pool snapshot + summary
# (Legacy "verbose_trace: true" still maps to "verbose".)
kame_log_level: normal

# Cooldown (seconds) for a key hit by a DAILY-quota or ACCOUNT/out-of-credit
# limit, on any provider. Overrides a misleadingly short retry hint (e.g.
# Google's "1s" on a daily 429) and is the ceiling for the adaptive backoff.
# Per-minute limits are unaffected. Default 3600 (1h). Range 1–86400 (24h).
daily_quota_cooldown_seconds: 3600

# How API keys appear in logs:
#   fingerprint — anonymized stable id like "k3f9a1" (default; never leaks)
#   prefix8     — first 8 chars of the key (mild partial leak)
#   full        — the entire key (debug only; writes the secret to the log)
key_log_style: fingerprint
