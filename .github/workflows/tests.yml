# Offline suites on every push and pull request.
#
# The suites stub Agent Zero, so they need no checkout of it; most are scripts
# (one process each) and two are pytest modules. tests/run_all.py runs each the
# right way and fails if any does.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: offline suites (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run every suite
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/run_all.py
